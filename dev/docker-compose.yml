# Local dependencies for the HTTP transport. Demo credentials only; never reuse them.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledger_mcp
      POSTGRES_USER: ledger_mcp
      POSTGRES_PASSWORD: ledger_mcp
    ports:
      - "5433:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/ledger-realm.json:/opt/keycloak/data/import/ledger-realm.json:ro
    ports:
      - "8180:8080"
