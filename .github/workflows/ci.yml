name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Unit and integration tests. Testcontainers needs a Docker daemon (PostgreSQL,
      # Keycloak, WireMock); ubuntu-latest runners ship one. StdioTransportIT launches
      # the packaged jar, so this also builds it.
      - name: Build and test
        run: ./gradlew --no-daemon build

      # Starts the server over stdio, converts its tools and builds every eval request
      # without calling the API, so a broken eval harness fails here and not at scoring time.
      - name: Eval harness dry run
        run: ./gradlew --no-daemon evals -PdryRun

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test
